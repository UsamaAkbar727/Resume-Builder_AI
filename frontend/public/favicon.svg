<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Ultra-premium dark slate -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0F" />
      <stop offset="100%" stop-color="#14141B" />
    </linearGradient>

    <!-- Brand Gradient: Vibrant Amber to Warm Orange-Red -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />   <!-- Yellow 300 -->
      <stop offset="50%" stop-color="#F59E0B" />  <!-- Amber 500 -->
      <stop offset="100%" stop-color="#EA580C" /> <!-- Orange 600 -->
    </linearGradient>

    <!-- Accent Glow: Bright yellow/white -->
    <linearGradient id="spark-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D Layering -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Base App Icon Container (Rounded Squircle) -->
  <rect width="512" height="512" rx="144" fill="url(#bg-grad)" />
  
  <!-- Outer Glow Ring (Subtle border) -->
  <rect x="4" y="4" width="504" height="504" rx="140" fill="none" stroke="#27273F" stroke-width="6" opacity="0.3" />
  <rect x="10" y="10" width="492" height="492" rx="134" fill="none" stroke="url(#brand-grad)" stroke-width="3" opacity="0.15" />

  <g filter="url(#shadow)" transform="translate(4, 0)">
    <!-- Stylized "R" + Document Flow Wave -->
    <!-- Left vertical bar of R (representing a document edge / spine) -->
    <rect x="120" y="110" width="44" height="292" rx="22" fill="url(#brand-grad)" />
    
    <!-- Top loop of R (smooth, bold curve) -->
    <path d="M142 110 H280 C350 110, 400 155, 400 225 C400 295, 350 338, 280 338 H142" 
          fill="none" 
          stroke="url(#brand-grad)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Diagonal leg of R, styled as a rising Flow wave (career progression/tracking) -->
    <path d="M230 310 C290 310, 320 340, 390 402" 
          fill="none" 
          stroke="url(#brand-grad)" 
          stroke-width="44" 
          stroke-linecap="round" />
          
    <!-- Glowing AI Spark (stars) inside the R loop to show AI integration -->
    <path d="M260 165 C260 171, 255 175, 250 175 C255 175, 260 179, 260 185 C260 179, 265 175, 270 175 C265 175, 260 171, 260 165 Z" 
          fill="url(#spark-grad)" />
          
    <path d="M330 220 C330 226, 325 230, 320 230 C325 230, 330 234, 330 240 C330 234, 335 230, 340 230 C335 230, 330 226, 330 220 Z" 
          fill="url(#spark-grad)" />
  </g>
</svg>
